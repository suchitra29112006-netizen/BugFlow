services:
  # 1. FastAPI Backend Web Service (Free Tier)
  - type: web
    name: bugflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. React Frontend Static Site (Automatically Free)
  - type: web
    name: bugflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bugflow-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
