services:
  # 1. BugFlow FastAPI Backend Web Service
  - type: web
    name: bugflow-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: bugflow-postgres
          property: connectionString

databases:
  # 2. Render Managed PostgreSQL Database (Free Tier)
  - name: bugflow-postgres
    plan: free
    databaseName: bugflow
    user: bugflow_user
